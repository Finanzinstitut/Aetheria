# Aetheria build configuration.
#
# The Minecraft, loader and Fabric API versions below are the ones this release is built and
# tested against. Check https://fabricmc.net/develop before raising any of them.

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with the configuration cache when Loom is applied.
org.gradle.configuration-cache=false

# Fabric
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21

# Mod
mod_version=1.0.0
maven_group=com.aetheria
archives_base_name=aetheria

# Dependencies
fabric_api_version=0.161.0+26.2

# Minecraft 26.2 runs on Java 25; the mod targets the same release.
java_version=25
